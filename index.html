<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Charity Bloom Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
      color: #333;
      text-align: center;
    }
    h1, h2 {
      color: #2c3e50;
    }
    img {
      max-width: 300px;
      margin: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    video {
      margin: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .section {
      margin: 40px 0;
    }
  </style>
</head>
<body>
  <h1>Charity Bloom Project</h1>

  <div class="section">
    <h2>Logo</h2>
    <img src="charitybloom-logo.png" alt="Charity Bloom Logo">
  </div>

  <div class="section">
    <h2>Introductory Video</h2>
    <video width="500" controls>
      <source src="introductory.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="section">
    <h2>Images</h2>
    <img src="image1.jpg" alt="Fotor Image 1">
    <img src="image2.jpg" alt="Fotor Image 2">
  </div>

</body>
</html>
